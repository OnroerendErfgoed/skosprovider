name: skosprovider backend tests

on:
  pull_request:
    paths:
      - skosprovider/**
      - tests/**
      - .github/workflows/skosprovider.yaml
      - pyproject.toml
      - requirements*.txt

  push:
    branches:
      - master

permissions: {}

jobs:
  test:
    uses: OnroerendErfgoed/shared-workflows/.github/workflows/python-tests.yml@v1
    permissions:
      contents: read
      pull-requests: write # coverage comment
    with:
      runs-on: ubuntu-latest # public repo: no self-hosted runners
      python-versions: '["3.11", "3.12", "3.13"]'
      requirements-file: requirements-dev.txt
      lint-command: "" # the old workflow ran no linter
      test-command: pytest --cov=skosprovider --cov-report xml:"$COVERAGE_XML" tests
      # The old workflow used the orgoro/coverage defaults: report only, no thresholds
      coverage-threshold-all: 0
      coverage-threshold-new: 0
      coverage-threshold-modified: 0
